[package]
name = "ccu-keygen"
version = "2.0.0"
description = "Linux-only activation key generator for Chess Coach Utility"
edition = "2021"
rust-version = "1.85"

[lib]
name = "ccu_keygen"
path = "src/lib.rs"

[[bin]]
name = "ccu-keygen"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["rand_core"] }
getrandom = "0.2"
gtk = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
wry = "0.55"

# The GUI is a single self-contained HTML/CSS/JS page (src/gui.html) rendered
# in a system webview (WebKitGTK) — the same design language as the CCU app's
# welcome selector.
#
# This tool issues 20-character, single-use ACTIVATION codes (CCU5 + 16
# base36 chars). The app exchanges a code once at the activation service for
# an Ed25519-signed, device-bound licence; only the activation service holds
# the private key that can sign licences. The retired symmetric product keys
# and offline .ccukey files are not supported.
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
