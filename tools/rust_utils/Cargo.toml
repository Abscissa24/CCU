[package]
name = "ccu-utils"
version = "0.1.0"
edition = "2021"
description = "Build verification and environment checking utilities for CCU"
license = "Proprietary"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
sha2 = "0.10"
hex = "0.4"
thiserror = "1"

[dev-dependencies]
tempfile = "3"

[lib]
name = "ccu_utils"
path = "src/lib.rs"

[[bin]]
name = "ccu-utils"
path = "src/main.rs"
